name: 📚 Sync Medium Articles

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at noon UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔗 Fetch Medium RSS Feed
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://medium.com/feed/@naveenkumarvelanati"
          readme_path: "./README.md"
          max_post_count: "5"
          template: "- [📝 $title]($url)"
          comment_tag_name: "MEDIUM_POSTS"

      - name: 📝 Commit changes
        run: |
          git config --local user.email "naveenkumarvelanati@gmail.com"
          git config --local user.name "🤖 GitHub Actions - Naveen"
          git add README.md
          git commit -m "📚 chore: sync medium articles" || echo "No changes"
          git push || echo "Nothing to push"
